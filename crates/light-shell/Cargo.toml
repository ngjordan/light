[package]
name = "iridium-light-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
rawnind-model = ["lightcraft-engine/rawnind-model"]
heif = ["lightcraft-codecs/heif"]

[dependencies]
lightcraft-engine.workspace = true
lightcraft-ui-egui.workspace = true
lightcraft-codecs.workspace = true
lightcraft-raster.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["x11", "wayland"] }
rfd.workspace = true
serde_json.workspace = true
log.workspace = true

# The SAM 3 models and the GPU denoiser need native threads, a network stack and a native GPU; a browser tab has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightcraft-engine = { workspace = true, features = ["sam", "denoise"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
lightcraft-wincolor.workspace = true
raw-window-handle = "0.6"

[dev-dependencies]
lightcraft-testkit.workspace = true
